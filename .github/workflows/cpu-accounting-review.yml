name: CPU accounting regression
"on":
  push:
    branches: ["ci/cpu-accounting-review"]
permissions:
  contents: read
  statuses: write
concurrency:
  group: cpu-accounting-review
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 2d0949d58dd31b66195143aecd714f2da23a84db
      - name: Exact source revision
        run: test "$(git rev-parse HEAD)" = "2d0949d58dd31b66195143aecd714f2da23a84db"
      - name: Mark pending
        run: >-
          gh api --silent --method POST
          "repos/$GH_REPO/statuses/2d0949d58dd31b66195143aecd714f2da23a84db"
          -f state=pending -f context="CPU accounting regression"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Kernel regressions
        run: >-
          sudo make test
          TARGETS="//pkg/sentry/kernel:kernel_test"
          OPTIONS="--test_filter=TestContainerCPU
          --test_arg=-test.v --test_timeout=180 --test_output=streamed
          --jobs=2 --local_test_jobs=1"
      - name: Event regressions
        if: always()
        run: >-
          sudo make test
          TARGETS="//runsc/boot:boot_test"
          OPTIONS="--test_filter=TestEvent
          --test_arg=-test.v --test_timeout=180 --test_output=streamed
          --jobs=2 --local_test_jobs=1"
      - name: Nogo for changed packages and their dependencies
        if: always()
        run: >-
          sudo make test
          TARGETS="//pkg/sentry/kernel:kernel_test_nogo //runsc/boot:boot_test_nogo //runsc/container:container_test_nogo"
          OPTIONS="--test_timeout=300 --test_output=streamed --jobs=2 --local_test_jobs=1"
      - name: Event integration including a real host cgroup
        if: always()
        run: >-
          sudo make test
          TARGETS="//runsc/container:container_test"
          OPTIONS="--test_filter=TestMultiContainerEvent
          --sandbox_writable_path=/sys/fs/cgroup
          --test_arg=-test.v --test_arg=--test_platforms=systrap
          --test_timeout=300 --test_sharding_strategy=disabled
          --test_output=streamed --jobs=2 --local_test_jobs=1"
      - name: Checkpoint integration with concurrent Event
        if: always()
        run: >-
          sudo make test
          TARGETS="//runsc/container:container_test"
          OPTIONS="--test_filter=TestMultiContainerSharedVolumeCheckpointRestore
          --test_arg=-test.v --test_arg=--test_platforms=systrap
          --test_timeout=300 --test_sharding_strategy=disabled
          --test_output=streamed --jobs=2 --local_test_jobs=1"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: always()
        with:
          go-version-file: go.mod
      - name: Go generation and build without background Git GC
        if: always()
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: gc.auto
          GIT_CONFIG_VALUE_0: "0"
        run: |
          tools/go_branch.sh
          git checkout go
          git clean -xf .
          go build ./...
      - name: Publish result
        if: always()
        run: |
          CPU_STATE=failure
          if [ "${{ job.status }}" = success ]; then CPU_STATE=success; fi
          gh api --silent --method POST "repos/$GH_REPO/statuses/2d0949d58dd31b66195143aecd714f2da23a84db" \
            -f state="$CPU_STATE" -f context="CPU accounting regression" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
